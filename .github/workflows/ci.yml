name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # 分類は1つにし、すべての重いジョブが参照する。
    # チェックごとに分類を分けると、チェックごとに「読まない場所」の一覧を保守することになり、判断の誤りが検査の抜けになるため分けない。
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # everyは、ファイルが分類のすべてのパターンに当てはまるときだけ変更として数える。
          # '**'で全体を対象にし、'!'でどの必須チェックも読まないファイルだけを除く。
          # 除外に挙げていない場所(新しい場所とワークフローを含む)の変更は、すべての重いジョブを起動する。
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              # Markdown(文書、Agent向けの指示書、IssueとPRのテンプレート)。
              # Biomeは処理せず、Type Check、Knip、Unit Test、Lint SQL、pgTAP and E2E Testのどれも読まない。
              # .mdを読む必須チェック(Markdownのlint、MDXのページ、文書を読むテストなど)を足すと、.mdだけのPRでそのチェックがskipされ、黙って通過する。
              # そのときは、この行を消すか、そのチェックが読む場所を除外の対象から外す。
              - '!**/*.md'
              # ライセンス(ルートのファイルだけに当たる)。どの必須チェックも読まない。
              - '!LICENSE'
              # 除外を足すときは、Lint、Type Check、Knip、Lint SQL、Unit Test、pgTAP and E2E Testのどれも読まないことを確かめる。迷うものは足さない。

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome Check
        run: pnpm lint

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Type Check
        run: pnpm typecheck

  knip:
    name: Knip
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Knip
        run: pnpm knip

  lint-sql:
    name: Lint SQL
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SQL Lint
        run: pnpm lint:sql

  unit-test:
    name: Unit Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: apps/web/coverage
          retention-days: 14

  e2e-test:
    name: pgTAP and E2E Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./apps/web/node_modules/@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Setup Supabase CLI environment variables
        run: cp .env.example .env

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start local Supabase
        run: supabase start -x studio,postgres-meta

      - name: Setup environment variables
        run: |
          eval "$(supabase status -o env)"
          cat <<EOF > apps/web/.env.local
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLISHABLE_KEY
          SUPABASE_SECRET_KEY=$SECRET_KEY
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
          EOF

      - name: Apply migrations and seed data
        run: supabase db reset

      - name: Run pgTAP Tests
        run: pnpm test:db

      - name: Run E2E Tests
        run: pnpm --filter web exec playwright test --workers=4
