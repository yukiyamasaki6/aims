name: Sync Preview Database

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sync-preview-db
  # リセットの途中で取り消さないため
  cancel-in-progress: false

jobs:
  sync-preview-db:
    name: Sync Preview Database
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Link to Preview Project
        run: supabase link --project-ref ${{ vars.SUPABASE_PREVIEW_PROJECT_ID }}

      - name: Reset Preview DB
        run: supabase db reset --remote --yes

      - name: Push config to Preview Project
        run: supabase config push --yes
