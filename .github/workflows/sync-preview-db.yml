name: Sync Preview Database

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-preview-db
  cancel-in-progress: true

jobs:
  sync-preview-db:
    name: Sync Preview Database
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Link to Preview Project
        run: supabase link --project-ref ${{ vars.SUPABASE_PREVIEW_PROJECT_ID }}

      - name: Reset Preview DB
        run: supabase db reset --linked --yes

      - name: Push config to Preview Project
        run: supabase config push
