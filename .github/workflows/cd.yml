name: CD

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/templates/**"
  workflow_dispatch:

concurrency:
  group: deploy-prod-db
  cancel-in-progress: true

jobs:
  deploy-prod-db:
    name: Deploy Production Database
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_PROD_SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Link to Production Project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROD_PROJECT_ID }}

      # NOTE: issue #458のマイグレーション統合に伴う一回限りの本番リセット。
      # 通常のsupabase db pushでは、squash後の新マイグレーションが本番の
      # 旧スキーマに対して差分適用されず、リネーム前の列を参照するRPC等で
      # 不整合を起こすため、db resetで作り直す。
      # 本番リセット完了を確認したら、このステップは元のdry-run+db pushに
      # 戻すこと（戻し忘れると以降のマージのたびに本番が全消去される）。
      - name: Reset Production DB
        run: supabase db reset --linked --yes

      - name: Push config to Production Project
        run: supabase config push
