name: CD

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/templates/**"
  workflow_dispatch:

concurrency:
  group: deploy-prod-db
  cancel-in-progress: true

jobs:
  deploy-prod-db:
    name: Deploy Production Database
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_PROD_SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Link to Production Project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROD_PROJECT_ID }}

      # NOTE: マイグレーションの作り直しに伴う一回限りの本番リセット。
      # 作り直した履歴は本番の履歴と食い違い、db pushでは適用できないため、db resetで作り直す。
      # seedは本番に適用しない。
      # 本番リセットの完了を確認したら、このステップは元のdry-run+db pushに戻すこと（戻し忘れると以降のマージのたびに本番が全消去される）。
      - name: Reset Production DB
        run: supabase db reset --linked --yes --no-seed

      - name: Push config to Production Project
        run: supabase config push
