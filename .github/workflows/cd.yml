name: CD

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/templates/**"
  workflow_dispatch:

concurrency:
  group: deploy-prod-db
  # DBと認証設定の反映を途中で取り消さないため
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prod-db:
    name: Deploy Production Database
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_PROD_SECRET_KEY }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_PROD_CLIENT_ID }}
      GOOGLE_OAUTH_SECRET: ${{ secrets.GOOGLE_OAUTH_PROD_CLIENT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Link to Production Project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROD_PROJECT_ID }}

      # 適用の直前の時点を取る。取れなければ、後続の適用(migrationとconfig)は動かない(docs/backup.md)。
      - name: Backup Production Database
        uses: ./.github/actions/backup-prod-db
        with:
          kind: pre-migration
          r2-endpoint: ${{ vars.BACKUP_R2_ENDPOINT }}
          r2-bucket: ${{ vars.BACKUP_R2_BUCKET }}
          r2-access-key-id: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          age-recipient: ${{ vars.BACKUP_AGE_RECIPIENT }}

      - name: Dry-run migrations
        run: supabase db push --dry-run --remote

      - name: Push migrations to Production DB
        run: supabase db push --yes --remote

      - name: Push config to Production Project
        run: supabase config push --yes
