<text x="478" y="1713.3" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">signedInを送る(送信中は解除し</text>
<text x="478" y="1734.3" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">ない)</text>
