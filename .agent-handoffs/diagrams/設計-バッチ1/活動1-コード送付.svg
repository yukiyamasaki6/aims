<rect x="472" y="377" width="51" height="19" rx="9.5" fill="#FFFFFF" stroke="#D9E2EB" stroke-width=".8"/>
<text x="497.5" y="391" font-size="12" font-weight="600" text-anchor="middle" fill="#172635">実行中</text>
<rect x="319" y="377" width="87" height="19" rx="9.5" fill="#FFFFFF" stroke="#D9E2EB" stroke-width=".8"/>
<text x="362.5" y="391" font-size="12" font-weight="600" text-anchor="middle" fill="#172635">実行中でない</text>
<rect x="343" y="533" width="63" height="19" rx="9.5" fill="#FFFFFF" stroke="#D9E2EB" stroke-width=".8"/>
<text x="374.5" y="547" font-size="12" font-weight="600" text-anchor="middle" fill="#172635">不備あり</text>
<rect x="472" y="533" width="63" height="19" rx="9.5" fill="#FFFFFF" stroke="#D9E2EB" stroke-width=".8"/>
<text x="503.5" y="547" font-size="12" font-weight="600" text-anchor="middle" fill="#172635">不備なし</text>
<rect x="1011" y="1163" width="39" height="19" rx="9.5" fill="#FFFFFF" stroke="#D9E2EB" stroke-width=".8"/>
<text x="1030.5" y="1177" font-size="12" font-weight="600" text-anchor="middle" fill="#172635">はい</text>
<rect x="1116" y="1163" width="51" height="19" rx="9.5" fill="#FFFFFF" stroke="#D9E2EB" stroke-width=".8"/>
<text x="1141.5" y="1177" font-size="12" font-weight="600" text-anchor="middle" fill="#172635">いいえ</text>
<rect x="629" y="1661" width="99" height="19" rx="9.5" fill="#FFFFFF" stroke="#D9E2EB" stroke-width=".8"/>
<text x="678.5" y="1675" font-size="12" font-weight="600" text-anchor="middle" fill="#172635">受け付けられた</text>
<rect x="794" y="1661" width="39" height="19" rx="9.5" fill="#FFFFFF" stroke="#D9E2EB" stroke-width=".8"/>
<text x="813.5" y="1675" font-size="12" font-weight="600" text-anchor="middle" fill="#172635">失敗</text>
<rect x="66" y="166" width="176" height="46" rx="23" fill="#1E486D" stroke="#1E486D"/>
<text x="154" y="193.8" font-size="14" text-anchor="middle" font-weight="700" fill="#FFFFFF">送信または再送を押す</text>
<polygon points="439,274 514,321 439,368 364,321" fill="#FFF3DE" stroke="#C18C38" stroke-width="2" filter="url(#shadow)"/>
<text x="439" y="325.8" font-size="14" text-anchor="middle" font-weight="700" fill="#724B16">実行中か</text>
<polygon points="439,430 564,477 439,524 314,477" fill="#FFF3DE" stroke="#C18C38" stroke-width="2" filter="url(#shadow)"/>
<text x="439" y="471.3" font-size="14" text-anchor="middle" font-weight="700" fill="#724B16">メール・待ち(コード段階)・</text>
<text x="439" y="492.3" font-size="14" text-anchor="middle" font-weight="700" fill="#724B16">チェックのいずれかに不備か</text>
<rect x="326.2" y="586" width="225.7" height="52" rx="9" fill="#FFFFFF" stroke="#94A8BA" stroke-width="1.7" filter="url(#shadow)"/>
<text x="439" y="616.8" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">不備を全て欄に示す(送らない)</text>
<rect x="340.2" y="814" width="197.7" height="52" rx="9" fill="#FFFFFF" stroke="#94A8BA" stroke-width="1.7" filter="url(#shadow)"/>
<text x="439" y="844.8" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">送信中にする(送付を依頼)</text>
<rect x="636" y="928" width="250" height="70" rx="9" fill="#FFFFFF" stroke="#94A8BA" stroke-width="1.7" filter="url(#shadow)"/>
<text x="761" y="957.3" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">コードの送付を頼む(トークン付き</text>
<text x="761" y="978.3" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">)</text>
<polygon points="1083,1060 1208,1107 1083,1154 958,1107" fill="#FFF3DE" stroke="#C18C38" stroke-width="2" filter="url(#shadow)"/>
<text x="1083" y="1101.3" font-size="14" text-anchor="middle" font-weight="700" fill="#724B16">登録済みの確認済み利用者か</text>
<text x="1083" y="1122.3" font-size="14" text-anchor="middle" font-weight="700" fill="#724B16">(サインアップのみ)</text>
<rect x="970.2" y="1216" width="225.7" height="52" rx="9" fill="#FFFFFF" stroke="#94A8BA" stroke-width="1.7" filter="url(#shadow)"/>
<text x="1083" y="1246.8" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">案内メールを送る(コードなし)</text>
<rect x="999" y="1444" width="168" height="52" rx="9" fill="#FFFFFF" stroke="#94A8BA" stroke-width="1.7" filter="url(#shadow)"/>
<text x="1083" y="1474.8" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">コードのメールを送る</text>
<polygon points="761,1558 851,1605 761,1652 671,1605" fill="#FFF3DE" stroke="#C18C38" stroke-width="2" filter="url(#shadow)"/>
<text x="761" y="1609.8" font-size="14" text-anchor="middle" font-weight="700" fill="#724B16">受け付けられたか</text>
<rect x="314" y="1714" width="250" height="93" rx="9" fill="#FFFFFF" stroke="#94A8BA" stroke-width="1.7" filter="url(#shadow)"/>
<text x="439" y="1744.3" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">コード段階へ。待ちを60秒にし、</text>
<text x="439" y="1765.3" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">トークンを消費してチェックをや</text>
<text x="439" y="1786.3" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">り直す</text>
<rect x="314" y="1983" width="250" height="93" rx="9" fill="#FFFFFF" stroke="#94A8BA" stroke-width="1.7" filter="url(#shadow)"/>
<text x="439" y="2013.3" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">失敗の理由を示し、トークンを消</text>
<text x="439" y="2034.3" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">費してチェックをやり直す(通信断</text>
<text x="439" y="2055.3" font-size="14" text-anchor="middle" font-weight="500" fill="#172635">も同じ)</text>
<rect x="102" y="2138" width="104" height="46" rx="23" fill="#FFFFFF" stroke="#2E597A" stroke-width="2.5"/>
<text x="154" y="2165.8" font-size="14" text-anchor="middle" font-weight="700" fill="#204C6F">終了</text>
<rect x="386" y="2246" width="106" height="46" rx="23" fill="#FFFFFF" stroke="#2E597A" stroke-width="2.5"/>
<text x="439" y="2273.8" font-size="14" text-anchor="middle" font-weight="700" fill="#204C6F">何もしない</text>
