<path d="M 1341.1 2698 L 1341.1 2711 Q 1341.1 2720 1332.1 2720 L 971.9 2720 Q 962.9 2720 962.9 2729 L 962.9 2756" fill="none" stroke="#64768A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
