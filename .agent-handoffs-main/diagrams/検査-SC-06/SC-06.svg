<rect width="1968.3200000000002" height="3180" fill="#FFFFFF"/>
<text x="30" y="43" font-size="21" font-weight="700" fill="#172635">SC-06 認証状態の購読で、セッション喪失を検知して/signinへ移る(通知が発火した後の流れ)</text>
<rect x="30.0" y="65" width="416.6" height="3093.0" fill="#F1F6FC"/>
<rect x="30.0" y="65" width="416.6" height="61" fill="#E1EDF9"/>
<rect x="30.0" y="65" width="5" height="61" fill="#356D9F"/>
