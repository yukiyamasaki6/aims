<text x="615.3" y="100.9" font-size="16" text-anchor="middle" font-weight="700" fill="#172635">窓口の変換(supabase-auth.tsの購読)</text>
<rect x="783.9200000000001" y="65" width="322" height="3093.0" fill="#F2F9F6"/>
<rect x="783.9200000000001" y="65" width="322" height="61" fill="#E0F1E8"/>
<rect x="783.9200000000001" y="65" width="5" height="61" fill="#3B8661"/>
<line x1="783.9200000000001" y1="65" x2="783.9200000000001" y2="3158.0" stroke="#D6DFE7"/>
<text x="944.9" y="100.9" font-size="16" text-anchor="middle" font-weight="700" fill="#172635">見張りの手続き(session.ts)</text>
<rect x="1105.92" y="65" width="470.4" height="3093.0" fill="#FCF8F1"/>
<rect x="1105.92" y="65" width="470.4" height="61" fill="#F7EEDF"/>
<rect x="1105.92" y="65" width="5" height="61" fill="#AA8142"/>
<line x1="1105.92" y1="65" x2="1105.92" y2="3158.0" stroke="#D6DFE7"/>
<text x="1341.1" y="100.9" font-size="16" text-anchor="middle" font-weight="700" fill="#172635">規則(auth-change、session-end-flow、auth-routes)</text>
<rect x="1576.3200000000002" y="65" width="322" height="3093.0" fill="#F3F8FA"/>
<rect x="1576.3200000000002" y="65" width="322" height="61" fill="#E5F0F3"/>
<rect x="1576.3200000000002" y="65" width="5" height="61" fill="#477B8D"/>
<line x1="1576.3200000000002" y1="65" x2="1576.3200000000002" y2="3158.0" stroke="#D6DFE7"/>
<text x="1737.3" y="100.9" font-size="16" text-anchor="middle" font-weight="700" fill="#172635">遷移(ページ全体の読み込み)</text>
<path d="M 238.3 232 L 238.3 245 Q 238.3 254 247.3 254 L 606.3 254 Q 615.3 254 615.3 263 L 615.3 290" fill="none" stroke="#64768A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
